# Phase 5 reverse proxy + HTTPS termination for System Health Monitor.
#
# Replace certificate paths with production certificates when deploying.
# For local testing, generate a self-signed certificate using:
#   ./nginx/scripts/generate-self-signed-cert.sh

upstream monitoring_server {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all clear-text traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Local/self-signed default cert paths.
    # Replace these two paths with real certificate files in production.
    ssl_certificate /home/kirito/Music/nginx/certs/dev.crt;
    ssl_certificate_key /home/kirito/Music/nginx/certs/dev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Serve built frontend assets from frontend/dist.
    root /home/kirito/Music/frontend/dist;
    index index.html;

    # Preserve existing API contract and path shape: /api/...
    location /api/ {
        proxy_pass http://monitoring_server;
        proxy_http_version 1.1;

        # Forward headers so FastAPI sees original host/protocol/client.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # SPA fallback for React Router and direct links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
