# Nginx top-level config for System Health Monitor (Phase 5).
#
# This file is intended for local testing and production adaptation.
# It includes a project server block that terminates TLS and proxies
# /api/* to the Monitoring Server at 127.0.0.1:8000.

worker_processes auto;

error_log /tmp/shm-nginx-error.log warn;
pid /tmp/shm-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /tmp/shm-nginx-access.log main;

    sendfile on;
    keepalive_timeout 65;

    include /home/kirito/Music/nginx/conf.d/*.conf;
}
